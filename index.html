<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Юридическая информация | Capri AI</title>
    <style>
        :root {
            --bg: #0c0e14;
            --card-bg: #141824;
            --text: #e2e8f0;
            --accent: #00f0ff;
            --border: rgba(0, 240, 255, 0.25);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 540px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.08);
            text-align: center;
        }
        h1 { margin-top: 0; color: #fff; font-size: 24px; }
        p { color: #94a3b8; font-size: 15px; margin-bottom: 28px; line-height: 1.5; }
        .links { display: flex; flex-direction: column; gap: 14px; }
        .btn {
            display: block;
            padding: 14px 20px;
            background: #1a2030;
            color: var(--accent);
            text-decoration: none;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: var(--accent);
            color: #0c0e14;
            border-color: var(--accent);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Capri AI // Legal</h1>
        <p>Официальные документы проекта: условия использования сервиса и политика конфиденциальности данных.</p>
        <div class="links">
            <a href="privacy.html" class="btn">Политика конфиденциальности</a>
            <a href="terms.html" class="btn">Условия использования</a>
        </div>
    </div>
</body>
</html>
